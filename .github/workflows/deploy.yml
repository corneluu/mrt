name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild to publish content edited in the admin page (01:00 UTC = 03:00/04:00 Romania)
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # keepalive: re-enables the schedule GitHub turns off after 60 days without commits

# Public values only (RLS protects the data); secrets never go here.
env:
  PUBLIC_SUPABASE_URL: https://afeskorcrokedycjciph.supabase.co
  PUBLIC_SUPABASE_KEY: sb_publishable_KrVlUg-Wp738FJ98VwbIZQ_Bzw18zbN
  PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFfdU2x-TKu306HI

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro
        run: npm run build
      # Re-enabling the workflow resets GitHub's 60-day inactivity timer for scheduled runs.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
